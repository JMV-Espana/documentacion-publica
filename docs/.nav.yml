# Navegación del sitio (plugin awesome-nav).
#
# append_unmatched se hereda en todas las subcarpetas: cualquier página o sección
# nueva que no aparezca listada aquí se añade sola al final, sin tocar este fichero.
append_unmatched: true

nav:
  # Título explícito: en el menú interesa "Inicio", pero el encabezado de la
  # página da la bienvenida, así que no coinciden.
  - Inicio: index.md
  - Corporativo
  - Secretaría
  - Tesorería
  - Actividades
  - Google Workspace
  - Editar esta web
