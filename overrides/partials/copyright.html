<!--
  Igual que el partials/copyright.html original del tema, pero con "Made with"
  traducido a "Hecho con" — Material no traduce esa cadena automáticamente ni
  con language: es, porque no pasa por su sistema de traducciones.
-->
<div class="md-copyright">
  {% if config.copyright %}
    <div class="md-copyright__highlight">
      {{ config.copyright }}
    </div>
  {% endif %}
  {% if not config.extra.generator == false %}
    Hecho con
    <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">
      Material for MkDocs
    </a>
  {% endif %}
</div>
