name: Comprobar documentación
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material mkdocs-awesome-nav mkdocs-exporter beautifulsoup4
      - run: mkdocs build --strict
        env:
          MKDOCS_EXPORTER_PDF_ENABLED: "false"