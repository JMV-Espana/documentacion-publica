site_name: JMV España — Documentación
site_url: https://jmv-espana.github.io/documentacion-publica
repo_url: https://github.com/JMV-Espana/documentacion-publica
repo_name: documentacion-publica

theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.action.edit   # añade un lápiz "Editar esta página" que lleva directo al editor de GitHub

extra_css:
  - assets/extra.css

plugins:
  - search
  - awesome-nav
  - exporter:
      formats:
        pdf:
          enabled: !ENV [MKDOCS_EXPORTER_PDF_ENABLED, true]
          buttons:
            - title: Descargar en PDF
              icon: material-file-download-outline
              enabled: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.enabled
              attributes: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.attributes

nav:
  - Inicio: index.md
  - Corporativo: 
    - Estatutos: Corporativo/estatutos.md
    - Estilo de vida: Corporativo/estilo-de-vida.md
    - Políticas: [...]
  - Secretaría: [...]
  - Tesorería: [...]
  - Actividades: [...]
  - Google Workspace: [...]
  - Identidad visual: [...]
  - Plantillas: [...]
  - Contacto: contacto.md